name: Release

on:
  workflow_dispatch:
  push:
    tags: [ 'v*' ]

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: microsoft
          cache: gradle

      - name: Assemble release
        run: ./gradlew :app:assembleRelease

      # Signing switches itself on once these secrets exist, rather than failing the run when they
      # do not. Unsigned APKs still install via adb, but Android will refuse them from a file
      # manager, so set the secrets before announcing a build to anyone.
      - name: Check for signing secrets
        id: secrets
        run: |
          if [ -n "${{ secrets.SIGNING_KEY }}" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No SIGNING_KEY secret set. Publishing UNSIGNED APKs."
          fi

      - name: Sign release
        if: steps.secrets.outputs.present == 'true'
        uses: kevin-david/zipalign-sign-android-release@v2
        with:
          releaseDirectory: app/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.SIGNING_KEY }}
          alias: ${{ secrets.ALIAS }}
          keyStorePassword: ${{ secrets.KEY_STORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}
          zipAlign: true

      # This is what puts the entry in the repository sidebar. Artifacts live on the run page,
      # need a GitHub login to download and expire; a release is public, permanent and linkable.
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          generate_release_notes: true
          files: app/build/outputs/apk/release/*.apk
