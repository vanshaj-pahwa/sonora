name: Release

on:
  workflow_dispatch:
  push:
    tags: [ 'v*' ]

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: microsoft
          cache: gradle

      # Gradle signs during the build, so there is one artifact per ABI and it is named correctly.
      # A separate signing step would leave the original "-unsigned" file next to a "-signed" copy,
      # and nobody downloading a release can tell which of those will install.
      - name: Decode signing keystore
        id: signing
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
        run: |
          if [ -z "$SIGNING_KEY" ]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No SIGNING_KEY secret set. The APKs will be unsigned and will not install."
            exit 0
          fi
          echo "$SIGNING_KEY" | base64 -d > "$RUNNER_TEMP/sonora.jks"
          echo "present=true" >> "$GITHUB_OUTPUT"
          {
            echo "KEYSTORE_FILE=$RUNNER_TEMP/sonora.jks"
            echo "KEYSTORE_PASSWORD=${{ secrets.KEY_STORE_PASSWORD }}"
            echo "KEY_ALIAS=${{ secrets.ALIAS }}"
            echo "KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}"
          } >> "$GITHUB_ENV"

      - name: Assemble release
        run: ./gradlew :app:assembleRelease

      # One file, named for the app and its version: sonora-1.1.0.apk.
      #
      # The build still splits by ABI, but only the 64-bit ARM slice is published. Every phone sold
      # in years is arm64; armeabi-v7a is 32-bit hardware this will not meet, and x86_64 is an
      # emulator. Publishing all four asked every downloader to identify their own CPU, and the
      # answer was arm64 every time.
      - name: Name the APK
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          SRC="app/build/outputs/apk/release/app-arm64-v8a-release.apk"
          if [ ! -f "$SRC" ]; then
            echo "::error::Expected $SRC. Release did not produce a signed arm64 build."
            ls -la app/build/outputs/apk/release/ || true
            exit 1
          fi
          cp "$SRC" "dist/sonora-${VERSION}.apk"
          # The tag carries a leading v and the file does not, so the notes below cannot use
          # github.ref_name or they would name a file nobody can download.
          echo "APK_VERSION=$VERSION" >> "$GITHUB_ENV"
          ls -la dist/

      - name: Fail if nothing publishable
        run: test -n "$(ls -A dist 2>/dev/null)" || { echo "No signed APKs produced"; exit 1; }

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          # There is one file, so the only thing worth saying is what it needs to run.
          body: |
            Download `sonora-${{ env.APK_VERSION }}.apk` and install it.

            Requires Android 8.0 or newer, on a 64-bit device.
          generate_release_notes: true
          files: dist/*.apk
