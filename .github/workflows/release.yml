name: Release

on:
  workflow_dispatch:
  push:
    tags: [ 'v*' ]

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: microsoft
          cache: gradle

      # Gradle signs during the build, so there is one artifact per ABI and it is named correctly.
      # A separate signing step would leave the original "-unsigned" file next to a "-signed" copy,
      # and nobody downloading a release can tell which of those will install.
      - name: Decode signing keystore
        id: signing
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
        run: |
          if [ -z "$SIGNING_KEY" ]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No SIGNING_KEY secret set. The APKs will be unsigned and will not install."
            exit 0
          fi
          echo "$SIGNING_KEY" | base64 -d > "$RUNNER_TEMP/sonora.jks"
          echo "present=true" >> "$GITHUB_OUTPUT"
          {
            echo "KEYSTORE_FILE=$RUNNER_TEMP/sonora.jks"
            echo "KEYSTORE_PASSWORD=${{ secrets.KEY_STORE_PASSWORD }}"
            echo "KEY_ALIAS=${{ secrets.ALIAS }}"
            echo "KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}"
          } >> "$GITHUB_ENV"

      - name: Assemble release
        run: ./gradlew :app:assembleRelease

      # Ship names a person can read: sonora-1.0.0-arm64-v8a.apk rather than
      # app-arm64-v8a-release.apk. Most phones want arm64-v8a; universal is the fallback.
      - name: Name the APKs
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          for f in app/build/outputs/apk/release/*.apk; do
            case "$f" in *-unsigned.apk) echo "Refusing to publish unsigned: $f"; continue;; esac
            abi=$(basename "$f" | sed -E 's/^app-(.*)-release\.apk$/\1/')
            cp "$f" "dist/sonora-${VERSION}-${abi}.apk"
          done
          ls -la dist/

      - name: Fail if nothing publishable
        run: test -n "$(ls -A dist 2>/dev/null)" || { echo "No signed APKs produced"; exit 1; }

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          # A person arriving from the releases page sees this before anything else, so the
          # question it answers is the only one they have: which file do I download.
          body: |
            ### Which APK?

            | File | Install this if |
            |---|---|
            | `arm64-v8a` | **Almost certainly this one.** Every mainstream phone from roughly 2017 on |
            | `armeabi-v7a` | An older 32 bit device |
            | `x86_64` | An emulator, or a Chromebook running Android |
            | `universal` | You are not sure. Works everywhere, about twice the size |

            Android refuses to install an APK built for another architecture, so trying
            `arm64-v8a` first costs nothing. Requires Android 8.0 or newer.
          generate_release_notes: true
          files: dist/*.apk
