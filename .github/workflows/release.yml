name: Release APK

on:
  workflow_dispatch:
  push:
    tags: [ 'v*' ]

jobs:
  release:
    name: Build release APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: microsoft
          cache: gradle

      # Unsigned by default so the workflow is green on a fresh clone. Signing switches itself on
      # once the four secrets below exist, rather than failing the build when they do not.
      - name: Assemble release
        run: ./gradlew :app:assembleRelease

      - name: Check for signing secrets
        id: secrets
        run: |
          if [ -n "${{ secrets.SIGNING_KEY }}" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "No SIGNING_KEY secret set, uploading unsigned APKs."
          fi

      - name: Sign release
        if: steps.secrets.outputs.present == 'true'
        uses: kevin-david/zipalign-sign-android-release@v2
        id: sign_app
        with:
          releaseDirectory: app/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.SIGNING_KEY }}
          alias: ${{ secrets.ALIAS }}
          keyStorePassword: ${{ secrets.KEY_STORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}
          zipAlign: true

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: sonora-release
          path: app/build/outputs/apk/release/*.apk
