name: CI

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths-ignore: [ 'README.md', 'docs/**', '.github/**/*.md' ]
  pull_request:
    branches: [ main ]
    paths-ignore: [ 'README.md', 'docs/**', '.github/**/*.md' ]

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      # core/ is committed as ordinary directories, not a submodule, so a plain checkout is enough.
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: microsoft
          cache: gradle

      - name: Unit tests
        run: ./gradlew :media3:testDebugUnitTest

      - name: Assemble debug
        run: ./gradlew :app:assembleDebug

      # Every green run leaves an installable APK behind. Grab it from the run page under
      # Artifacts; arm64-v8a covers essentially every phone from the last several years, and the
      # universal build is there for anything older.
      - name: Upload debug APKs
        uses: actions/upload-artifact@v4
        with:
          name: sonora-debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30
